<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Atitude — Demandas</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #E87722;
      --orange-dim: rgba(232,119,34,0.12);
      --orange-border: rgba(232,119,34,0.25);
      --black: #0C0C0C;
      --surface: #141414;
      --surface2: #1C1C1C;
      --surface3: #222222;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #F0EDE8;
      --text-muted: #7A756E;
      --text-dim: #3E3A35;
      --green: #1D9E75;
      --green-bg: rgba(29,158,117,0.12);
      --amber: #EF9F27;
      --amber-bg: rgba(239,159,39,0.12);
      --purple: #7F77DD;
      --purple-bg: rgba(127,119,221,0.12);
      --red: #E24B4A;
      --red-bg: rgba(226,75,74,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      height: 56px;
      background: rgba(12,12,12,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 0.5px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .brand-name span { color: var(--orange); }

    .brand-sep {
      width: 1px;
      height: 18px;
      background: var(--border2);
    }

    .brand-sub {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-new {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--orange);
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-new:hover { opacity: 0.85; }
    .btn-new svg { width: 13px; height: 13px; }

    /* ── KPIs ── */
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 0.5px solid var(--border);
    }

    .kpi {
      background: var(--surface);
      padding: 14px 1.25rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kpi-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .kpi-info { display: flex; flex-direction: column; gap: 1px; }

    .kpi-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 1.5rem;
      border-bottom: 0.5px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
      background: var(--surface);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-right: 2px;
    }

    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 20px;
      border: 0.5px solid var(--border2);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: all 0.15s;
      font-family: 'Space Grotesk', sans-serif;
    }

    .pill:hover { border-color: var(--orange-border); color: var(--text); }
    .pill.on { background: var(--orange); color: #000; border-color: var(--orange); }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--surface2);
      border: 0.5px solid var(--border2);
      border-radius: 8px;
      padding: 6px 12px;
    }

    .search-wrap svg { width: 13px; height: 13px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }

    #searchInput {
      background: none;
      border: none;
      outline: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      color: var(--text);
      width: 160px;
    }

    #searchInput::placeholder { color: var(--text-dim); }

    /* ── BOARD ── */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      min-height: calc(100vh - 56px - 49px - 45px);
      align-items: start;
    }

    .col {
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }

    .col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 1.25rem 12px;
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 56px;
      background: var(--surface);
      z-index: 10;
    }

    .col-left { display: flex; align-items: center; gap: 8px; }

    .col-indicator {
      width: 3px;
      height: 18px;
      border-radius: 2px;
    }

    .col-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .col-count {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text-muted);
      border: 0.5px solid var(--border2);
    }

    .col-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface2);
      border: 0.5px solid var(--border2);
      border-radius: 10px;
      padding: 13px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 10px 0 0 10px;
    }

    .card.col-0::before { background: var(--purple); }
    .card.col-1::before { background: var(--amber); }
    .card.col-2::before { background: var(--green); }

    .card:hover { border-color: rgba(255,255,255,0.2); background: var(--surface3); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }

    .tag {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .tag-urgente { background: var(--red-bg); color: var(--red); border: 0.5px solid rgba(226,75,74,0.25); }
    .tag-normal { background: var(--purple-bg); color: var(--purple); border: 0.5px solid rgba(127,119,221,0.25); }

    .card-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .chip svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; flex-shrink: 0; }

    .chip-sep { width: 1px; height: 10px; background: var(--border2); }

    .av {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--orange-dim);
      color: var(--orange);
      font-size: 8px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 0.5px solid var(--orange-border);
    }

    .chip-warn { color: var(--amber) !important; }

    .card-obs {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.55;
      border-top: 0.5px solid var(--border);
      padding-top: 9px;
      margin-top: 2px;
      display: none;
    }

    .card.open .card-obs { display: block; }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 9px;
      margin-top: 6px;
      border-top: 0.5px solid var(--border);
    }

    .act-group { display: flex; gap: 4px; }

    .act-btn {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 6px;
      border: 0.5px solid var(--border2);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s;
    }

    .act-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .act-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .act-btn.del:hover { background: var(--red-bg); color: var(--red); border-color: rgba(226,75,74,0.3); }
    .act-btn.edit:hover { background: var(--orange-dim); color: var(--orange); border-color: var(--orange-border); }

    /* ── ADD BTN ── */
    .add-btn {
      margin: 0 12px 12px;
      padding: 9px;
      border: 0.5px dashed var(--border2);
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      letter-spacing: 0.03em;
      transition: all 0.15s;
    }

    .add-btn:hover { background: var(--surface2); color: var(--text-muted); border-color: var(--border2); }
    .add-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }

    /* ── EMPTY ── */
    .empty-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      gap: 8px;
    }

    .empty-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg { width: 16px; height: 16px; stroke: var(--text-dim); fill: none; stroke-width: 1.5; stroke-linecap: round; }
    .empty-col p { font-size: 12px; color: var(--text-dim); }

    /* ── MODAL OVERLAY ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 0.5px solid var(--border2);
      border-radius: 14px;
      padding: 1.5rem;
      width: 100%;
      max-width: 420px;
      animation: modal-in 0.18s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--surface2);
      border: 0.5px solid var(--border2);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s;
    }

    .modal-close:hover { background: var(--surface3); color: var(--text); }
    .modal-close svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }

    .field { margin-bottom: 11px; }

    .field label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: var(--surface2);
      border: 0.5px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: var(--orange); }

    .field textarea { height: 72px; resize: vertical; }

    .field select { cursor: pointer; }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .modal-foot {
      display: flex;
      gap: 8px;
      margin-top: 1.25rem;
    }

    .btn-save {
      flex: 1;
      background: var(--orange);
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-save:hover { opacity: 0.85; }

    .btn-cancel {
      background: var(--surface2);
      color: var(--text-muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      border: 0.5px solid var(--border2);
      cursor: pointer;
      transition: all 0.12s;
    }

    .btn-cancel:hover { color: var(--text); background: var(--surface3); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .board { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
      #searchInput { width: 100px; }
      .col-head { top: 56px; }
    }

    @media (max-width: 420px) {
      .topbar { height: auto; padding: 10px 1rem; }
      .brand-sub { display: none; }
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border2); }

    /* ── SELECT OPTION ── */
    option { background: var(--surface2); color: var(--text); }

    /* ── DATE INPUT ── */
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="brand">
    <img src="logo.png" alt="Studio Atitude" class="brand-logo" />
    <span class="brand-name">Studio <span>Atitude</span></span>
    <div class="brand-sep"></div>
    <span class="brand-sub">Demandas</span>
  </div>
  <div class="topbar-right">
    <button class="btn-new" onclick="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nova demanda
    </button>
  </div>
</header>

<!-- KPIs -->
<div class="kpis">
  <div class="kpi">
    <div class="kpi-dot" style="background:var(--purple)"></div>
    <div class="kpi-info">
      <span class="kpi-val" id="st0">0</span>
      <span class="kpi-label">Solicitadas</span>
    </div>
  </div>
  <div class="kpi">
    <div class="kpi-dot" style="background:var(--amber)"></div>
    <div class="kpi-info">
      <span class="kpi-val" id="st1">0</span>
      <span class="kpi-label">Em progresso</span>
    </div>
  </div>
  <div class="kpi">
    <div class="kpi-dot" style="background:var(--green)"></div>
    <div class="kpi-info">
      <span class="kpi-val" id="st2">0</span>
      <span class="kpi-label">Entregues</span>
    </div>
  </div>
  <div class="kpi">
    <div class="kpi-dot" style="background:var(--border2)"></div>
    <div class="kpi-info">
      <span class="kpi-val" id="st3">0</span>
      <span class="kpi-label">Total</span>
    </div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="filters">
    <span class="filter-label">Tipo</span>
    <button class="pill on" data-f="todos" onclick="sf(this)">Todos</button>
    <button class="pill" data-f="Redes sociais" onclick="sf(this)">
      <svg style="width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;vertical-align:-1px;margin-right:3px" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>Redes sociais
    </button>
    <button class="pill" data-f="Banner/cartaz" onclick="sf(this)">
      <svg style="width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;vertical-align:-1px;margin-right:3px" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="14" rx="1"/></svg>Banner/cartaz
    </button>
    <button class="pill" data-f="Vídeo/motion" onclick="sf(this)">
      <svg style="width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;vertical-align:-1px;margin-right:3px" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Vídeo/motion
    </button>
    <button class="pill" data-f="Outro" onclick="sf(this)">Outro</button>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar demanda..." oninput="render()" />
  </div>
</div>

<!-- BOARD -->
<main class="board">
  <div class="col">
    <div class="col-head">
      <div class="col-left">
        <div class="col-indicator" style="background:var(--purple)"></div>
        <span class="col-name">Solicitado</span>
      </div>
      <span class="col-count" id="cc0">0</span>
    </div>
    <div class="col-body" id="col0"></div>
    <button class="add-btn" onclick="openModal(0)">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar
    </button>
  </div>

  <div class="col">
    <div class="col-head">
      <div class="col-left">
        <div class="col-indicator" style="background:var(--amber)"></div>
        <span class="col-name">Em progresso</span>
      </div>
      <span class="col-count" id="cc1">0</span>
    </div>
    <div class="col-body" id="col1"></div>
    <button class="add-btn" onclick="openModal(1)">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar
    </button>
  </div>

  <div class="col">
    <div class="col-head">
      <div class="col-left">
        <div class="col-indicator" style="background:var(--green)"></div>
        <span class="col-name">Entregue</span>
      </div>
      <span class="col-count" id="cc2">0</span>
    </div>
    <div class="col-body" id="col2"></div>
    <button class="add-btn" onclick="openModal(2)">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar
    </button>
  </div>
</main>

<!-- MODAL OVERLAY -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">Nova demanda</span>
      <button class="modal-close" onclick="closeModal()" aria-label="Fechar">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="field">
      <label>Título da demanda</label>
      <input type="text" id="fTitulo" placeholder="Ex: Arte culto de domingo" />
    </div>
    <div class="field">
      <label>Solicitante</label>
      <input type="text" id="fSolicitante" placeholder="Nome de quem pediu" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>Tipo</label>
        <select id="fTipo">
          <option>Redes sociais</option>
          <option>Banner/cartaz</option>
          <option>Vídeo/motion</option>
          <option>Outro</option>
        </select>
      </div>
      <div class="field">
        <label>Prioridade</label>
        <select id="fPrioridade">
          <option>Normal</option>
          <option>Urgente</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Prazo</label>
        <input type="date" id="fPrazo" />
      </div>
      <div class="field">
        <label>Coluna</label>
        <select id="fCol">
          <option value="0">Solicitado</option>
          <option value="1">Em progresso</option>
          <option value="2">Entregue</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Observações</label>
      <textarea id="fObs" placeholder="Medidas, cores, referências, formato..."></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn-save" onclick="saveCard()">Salvar demanda</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
  const KEY = 'studioAtitude_v2';
  let tasks = [], flt = 'todos', eid = null;

  function ini(n) {
    if (!n) return '?';
    const p = n.trim().split(' ');
    return (p.length >= 2 ? p[0][0] + p[p.length - 1][0] : n.slice(0, 2)).toUpperCase();
  }

  function fmt(d) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    return day + '/' + m + '/' + y;
  }

  function near(d) {
    if (!d) return false;
    return d <= new Date(Date.now() + 3 * 864e5).toISOString().slice(0, 10);
  }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function render() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    const cols = [0, 1, 2].map(i => document.getElementById('col' + i));
    cols.forEach(c => c.innerHTML = '');
    const counts = [0, 0, 0];

    const list = tasks.filter(t => {
      if (flt !== 'todos' && t.tipo !== flt) return false;
      if (q && !t.titulo.toLowerCase().includes(q) && !(t.solicitante || '').toLowerCase().includes(q)) return false;
      return true;
    });

    list.forEach(t => {
      counts[t.col]++;
      const el = document.createElement('div');
      el.className = 'card col-' + t.col;
      const pw = near(t.prazo) && t.col < 2;

      const prev = t.col > 0
        ? `<button class="act-btn" onclick="mv(${t.id},-1);event.stopPropagation()" title="Voltar coluna">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          </button>` : '';

      const next = t.col < 2
        ? `<button class="act-btn" onclick="mv(${t.id},1);event.stopPropagation()" title="Avançar coluna">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>` : '';

      const solChip = t.solicitante
        ? `<span class="chip-sep"></span>
           <span class="chip">
             <span class="av">${ini(t.solicitante)}</span>
             ${t.solicitante}
           </span>` : '';

      const prazoChip = t.prazo
        ? `<span class="chip-sep"></span>
           <span class="chip ${pw ? 'chip-warn' : ''}">
             <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
             ${fmt(t.prazo)}${pw ? ' · urgente' : ''}
           </span>` : '';

      el.innerHTML = `
        <div class="card-top">
          <span class="card-title">${t.titulo}</span>
          <span class="tag tag-${t.prioridade.toLowerCase()}">${t.prioridade}</span>
        </div>
        <div class="card-chips">
          <span class="chip">
            <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            ${t.tipo}
          </span>
          ${solChip}
          ${prazoChip}
        </div>
        ${t.obs ? `<div class="card-obs">${t.obs}</div>` : ''}
        <div class="card-actions">
          <div class="act-group">${prev}${next}</div>
          <div class="act-group">
            <button class="act-btn edit" onclick="editCard(${t.id});event.stopPropagation()" title="Editar">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Editar
            </button>
            <button class="act-btn del" onclick="del(${t.id});event.stopPropagation()" title="Excluir">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </div>`;

      if (t.obs) el.onclick = () => el.classList.toggle('open');
      cols[t.col].appendChild(el);
    });

    [0, 1, 2].forEach(i => {
      document.getElementById('cc' + i).textContent = counts[i];
      if (!cols[i].children.length) {
        cols[i].innerHTML = `
          <div class="empty-col">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2M8 7V5a2 2 0 0 0-4 0v2"/></svg>
            </div>
            <p>Sem demandas aqui</p>
          </div>`;
      }
    });

    document.getElementById('st0').textContent = tasks.filter(t => t.col === 0).length;
    document.getElementById('st1').textContent = tasks.filter(t => t.col === 1).length;
    document.getElementById('st2').textContent = tasks.filter(t => t.col === 2).length;
    document.getElementById('st3').textContent = tasks.length;
  }

  function sf(el) {
    document.querySelectorAll('.pill').forEach(b => b.classList.remove('on'));
    el.classList.add('on');
    flt = el.dataset.f;
    render();
  }

  function openModal(col) {
    eid = null;
    document.getElementById('modalTitle').textContent = 'Nova demanda';
    document.getElementById('fTitulo').value = '';
    document.getElementById('fSolicitante').value = '';
    document.getElementById('fTipo').value = 'Redes sociais';
    document.getElementById('fPrioridade').value = 'Normal';
    document.getElementById('fPrazo').value = '';
    document.getElementById('fObs').value = '';
    document.getElementById('fCol').value = col !== undefined ? col : 0;
    document.getElementById('overlay').classList.add('open');
    document.getElementById('fTitulo').focus();
  }

  function editCard(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    eid = id;
    document.getElementById('modalTitle').textContent = 'Editar demanda';
    document.getElementById('fTitulo').value = t.titulo;
    document.getElementById('fSolicitante').value = t.solicitante || '';
    document.getElementById('fTipo').value = t.tipo;
    document.getElementById('fPrioridade').value = t.prioridade;
    document.getElementById('fPrazo').value = t.prazo || '';
    document.getElementById('fObs').value = t.obs || '';
    document.getElementById('fCol').value = t.col;
    document.getElementById('overlay').classList.add('open');
    document.getElementById('fTitulo').focus();
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
  }

  function overlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  function saveCard() {
    const titulo = document.getElementById('fTitulo').value.trim();
    if (!titulo) { document.getElementById('fTitulo').focus(); return; }
    const d = {
      titulo,
      solicitante: document.getElementById('fSolicitante').value.trim(),
      tipo: document.getElementById('fTipo').value,
      prioridade: document.getElementById('fPrioridade').value,
      prazo: document.getElementById('fPrazo').value,
      obs: document.getElementById('fObs').value.trim(),
      col: parseInt(document.getElementById('fCol').value)
    };
    if (eid) Object.assign(tasks.find(x => x.id === eid), d);
    else tasks.push({ id: Date.now(), ...d });
    persist();
    closeModal();
    render();
  }

  function mv(id, dir) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.col = Math.max(0, Math.min(2, t.col + dir));
    persist();
    render();
  }

  function del(id) {
    if (!confirm('Excluir esta demanda?')) return;
    tasks = tasks.filter(x => x.id !== id);
    persist();
    render();
  }

  // Atalho teclado: Enter salva modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && e.metaKey && document.getElementById('overlay').classList.contains('open')) saveCard();
  });

  // Init
  tasks = JSON.parse(localStorage.getItem(KEY) || 'null') || [];
  render();
</script>
</body>
</html>
